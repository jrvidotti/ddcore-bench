# ddcore: one process (HTTP, job workers, scheduler) + Postgres.
name: bench-ddcore

x-limits: &app-limits
  cpus: ${APP_CPUS:-2}
  mem_limit: ${APP_MEM:-2g}

services:
  db:
    image: postgres:17-alpine
    cpus: ${DB_CPUS:-2}
    mem_limit: ${DB_MEM:-2g}
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=200"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: compose/ddcore.Dockerfile
      args:
        DDCORE_VERSION: ${DDCORE_VERSION:-0.21.10}
    image: ddcore-bench/ddcore:${DDCORE_VERSION:-0.21.10}
    <<: *app-limits
    environment:
      DDCORE_DSN: postgres://bench:bench@db:5432/bench?sslmode=disable&pool_max_conns=${PG_POOL:-20}
      DDCORE_ADMIN_PASSWORD: bench-admin
    ports: ["8101:8080"]
    volumes: [ddcore-data:/data]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pg-data:
  ddcore-data:

# A fixed subnet: Docker's default pools run out on busy machines.
networks:
  default:
    ipam:
      config: [{ subnet: 10.201.1.0/24 }]
